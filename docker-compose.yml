services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      VECTOR_DB_URI: /data/vectordb
      MEMORY_DB_PATH: /data/cache/memory.sqlite
      FRONTEND_ORIGIN: http://localhost:3000
    volumes:
      - rag-vectordb:/data/vectordb
      - rag-cache:/data/cache

  web:
    build:
      context: ./web
    ports:
      - "3000:3000"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-${OPENAI_API_KEY}}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_HTTP_REFERER: http://localhost:3000
      LLM_APP_TITLE: hybridRAG
      FASTAPI_URL: http://api:8000
    depends_on:
      - api

volumes:
  rag-vectordb:
  rag-cache:
