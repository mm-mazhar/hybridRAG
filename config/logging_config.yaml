version: 1
disable_existing_loggers: false
formatters:
  default:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    formatter: default
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    formatter: default
    filename: logs/app.log
    maxBytes: 2097152
    backupCount: 5
    encoding: utf-8
    delay: true
loggers:
  hybridrag:
    level: INFO
    handlers: [console, file]
    propagate: false
  httpx:
    level: WARNING
  httpx2:
    level: WARNING
  httpcore:
    level: WARNING
root:
  level: INFO
  handlers: [console, file]
