[project]
name = "document-pipeline"
version = "0.1.0"
description = "Hybrid RAG showcase: FastAPI + Next.js with OpenAI-compatible models and LanceDB."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "colorlog>=6.9.0",
    "docling>=2.22.0",
    "fastapi[standard]>=0.115.14",
    "lancedb>=0.19.0",
    "langchain-core>=1.6.2",
    "langchain-openai>=1.6.1",
    "openai>=1.63.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "python-dotenv>=1.0.1",
    "pyyaml==6.0.3",
    "requests>=2.32.3",
    "tiktoken>=0.9.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "lefthook>=2.1.12",
    "mypy>=2.3.1",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/api",
    "src/core",
    "src/inference",
    "src/memory",
    "src/processing",
    "src/prompts",
    "src/rag",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    ".history",
    ".agents",
    "docs",
    "web",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/api/routes_*.py" = ["B008"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
mypy_path = "src"
exclude = ["tests/test_add\\.py"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--ignore=tests/test_add.py"
