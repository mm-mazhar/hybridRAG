[project]
name = "document-pipeline"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "colorlog>=6.9.0",
    "docling>=2.22.0",
    "lancedb>=0.19.0",
    "openai>=1.63.0",
    "pydantic>=2.10.6",
    "python-dotenv>=1.0.1",
    "pyyaml==6.0.2",
    "requests>=2.32.3",
    "streamlit>=1.42.0",
    "tiktoken>=0.9.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "lefthook>=2.1.12",
    "mypy>=2.3.1",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    ".history",
    "docs",
    "src/app/5_chat_app - Copy.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
exclude = ["src/app/utils/__init__\\.py", "tests/test_add\\.py"]
check_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/test_add.py"
