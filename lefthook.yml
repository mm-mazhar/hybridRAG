post-checkout:
  jobs:
    - name: branch-name
      script: branch-name.sh
      runner: bash

pre-commit:
  jobs:
    - run: uv run ruff check --fix {staged_files}
      glob: "*.py"
      stage_fixed: true
    - run: uv run ruff format {staged_files}
      glob: "*.py"
      stage_fixed: true
    - name: typecheck
      run: uv run mypy
      glob: "**/*.py"

commit-msg:
  jobs:
    - script: conventional.sh
      runner: bash

